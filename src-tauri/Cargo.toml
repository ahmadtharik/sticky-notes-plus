[package]
name = "sticky_notes_plus"
version = "0.1.0"
description = "Sticky Notes+ — sticky notes with checklists, date-chip reminders, and optional Google Calendar sync"
authors = ["Ahmad"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sticky_notes_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
probe = []

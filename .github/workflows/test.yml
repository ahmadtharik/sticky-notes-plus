name: Test

# Runs the tests on every push to main and keeps the build cache warm for
# release.yml.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

[package]
name = "sticky-notes-plus-slint"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Native Slint implementation of Sticky Notes+"

[features]
# Probes and soak tests used for acceptance runs; never in release installers.
dev-tools = []

[dependencies]
anyhow = "1.0"
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg", "bmp"] }
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "=1.9.0", features = ["raw-window-handle-06"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Native Windows tray foundation. It is target-scoped so Linux CI does not
# require GTK/libappindicator system packages.
tray-icon = { version = "0.24.2", default-features = false }
# RegisterHotKey is part of the Win32 API, so the global shortcut has no
# secondary GUI runtime and hands work back to Slint through a channel.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# This is the public, sealed Winit accessor supplied by Slint's selected
# backend. It lets the native RichEdit child follow its Slint parent on resize;
# no private Slint APIs or second event loop are used.
i-slint-backend-winit = { version = "=1.9.0", default-features = false, features = ["renderer-software"] }
raw-window-handle = "0.6"
windows = { version = "0.61.3", features = ["Win32_Graphics_Gdi", "Win32_UI_Controls_RichEdit", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices", "Win32_System_Ole", "Win32_System_WinRT", "Data_Xml_Dom", "Foundation", "Globalization", "Storage_Streams", "UI_Notifications", "Web_Http", "Web_Http_Filters", "Web_Http_Headers"] }
windows-core = "=0.61.2"

[build-dependencies]
slint-build = "=1.9.0"

[profile.release]
opt-level = 2
